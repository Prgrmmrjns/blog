<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">How Spielfeld turns Bundesliga data into an explainable match prediction</title>
  <desc id="desc">Four connected stages show match and lineup data, engineered features, TabPFN probabilities, and the interactive ShapIQ lineup lab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1711"/>
      <stop offset="1" stop-color="#14271d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3024"/>
      <stop offset="1" stop-color="#112219"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7adaa5"/>
      <stop offset="1" stop-color="#d4ff3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7adaa5"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="32" fill="url(#bg)"/>
  <path d="M0 190C230 60 390 270 620 130s390-60 580-130v680H0z" fill="#239ba7" opacity=".035"/>
  <g opacity=".09" stroke="#7adaa5">
    <path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200M0 480h1200M0 560h1200M0 640h1200"/>
    <path d="M80 0v680M160 0v680M240 0v680M320 0v680M400 0v680M480 0v680M560 0v680M640 0v680M720 0v680M800 0v680M880 0v680M960 0v680M1040 0v680M1120 0v680"/>
  </g>

  <text x="70" y="78" fill="#f3f5ed" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="750">From a matchday to a prediction</text>
  <text x="70" y="112" fill="#9eb3a5" font-family="Inter,system-ui,sans-serif" font-size="17">One row per fixture. The lineup is part of the model, not decoration.</text>

  <g filter="url(#shadow)">
    <g transform="translate(70 165)">
      <rect width="245" height="380" rx="22" fill="url(#card)" stroke="#355344"/>
      <rect x="20" y="20" width="42" height="28" rx="8" fill="#7adaa5" opacity=".15"/>
      <text x="41" y="40" text-anchor="middle" fill="#7adaa5" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800">01</text>
      <text x="20" y="84" fill="#f3f5ed" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="700">Match data</text>
      <text x="20" y="112" fill="#9eb3a5" font-family="Inter,system-ui,sans-serif" font-size="14">OpenLigaDB + XI sources</text>

      <g transform="translate(20 145)">
        <rect width="205" height="82" rx="14" fill="#0c1912" stroke="#2a4738"/>
        <circle cx="29" cy="27" r="10" fill="#ef4444"/>
        <circle cx="29" cy="56" r="10" fill="#16a34a"/>
        <text x="49" y="32" fill="#e9eee8" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="650">Freiburg</text>
        <text x="49" y="61" fill="#e9eee8" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="650">Bremen</text>
        <text x="181" y="45" text-anchor="end" fill="#d4ff3f" font-family="ui-monospace,monospace" font-size="12">30 AUG</text>
      </g>
      <g fill="#9eb3a5" font-family="Inter,system-ui,sans-serif" font-size="14">
        <text x="20" y="267">+ Results since 2019/20</text>
        <text x="20" y="300">+ Expected starting XIs</text>
        <text x="20" y="333">+ Squad + player ratings</text>
      </g>
    </g>

    <g transform="translate(345 165)">
      <rect width="245" height="380" rx="22" fill="url(#card)" stroke="#355344"/>
      <rect x="20" y="20" width="42" height="28" rx="8" fill="#7adaa5" opacity=".15"/>
      <text x="41" y="40" text-anchor="middle" fill="#7adaa5" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800">02</text>
      <text x="20" y="84" fill="#f3f5ed" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="700">Feature row</text>
      <text x="20" y="112" fill="#9eb3a5" font-family="Inter,system-ui,sans-serif" font-size="14">The match becomes numbers</text>
      <g transform="translate(20 143)" font-family="ui-monospace,monospace" font-size="13">
        <g fill="#0c1912" stroke="#2a4738">
          <rect width="205" height="34" rx="8"/>
          <rect y="44" width="205" height="34" rx="8"/>
          <rect y="88" width="205" height="34" rx="8"/>
          <rect y="132" width="205" height="34" rx="8"/>
          <rect y="176" width="205" height="34" rx="8"/>
        </g>
        <g fill="#9eb3a5">
          <text x="12" y="22">elo_diff</text>
          <text x="193" y="22" text-anchor="end" fill="#d4ff3f">+214.5</text>
          <text x="12" y="66">form5_diff</text>
          <text x="193" y="66" text-anchor="end" fill="#d4ff3f">+0.60</text>
          <text x="12" y="110">value_diff</text>
          <text x="193" y="110" text-anchor="end" fill="#d4ff3f">+50m</text>
          <text x="12" y="154">xi_strength</text>
          <text x="193" y="154" text-anchor="end" fill="#ef8b8b">-0.49</text>
          <text x="12" y="198">midfield</text>
          <text x="193" y="198" text-anchor="end" fill="#ef8b8b">-0.38</text>
        </g>
      </g>
      <text x="20" y="350" fill="#7adaa5" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="650">+ 30 more signals</text>
    </g>

    <g transform="translate(620 165)">
      <rect width="245" height="380" rx="22" fill="url(#card)" stroke="#355344"/>
      <rect x="20" y="20" width="42" height="28" rx="8" fill="#7adaa5" opacity=".15"/>
      <text x="41" y="40" text-anchor="middle" fill="#7adaa5" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800">03</text>
      <text x="20" y="84" fill="#f3f5ed" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="700">TabPFN</text>
      <text x="20" y="112" fill="#9eb3a5" font-family="Inter,system-ui,sans-serif" font-size="14">Three-way probability</text>

      <g transform="translate(20 148)" font-family="Inter,system-ui,sans-serif">
        <text x="0" y="12" fill="#e9eee8" font-size="13" font-weight="650">HOME</text>
        <text x="205" y="12" text-anchor="end" fill="#d4ff3f" font-size="20" font-weight="800">53%</text>
        <rect y="25" width="205" height="13" rx="6.5" fill="#0c1912"/>
        <rect y="25" width="109" height="13" rx="6.5" fill="url(#accent)"/>

        <text x="0" y="82" fill="#e9eee8" font-size="13" font-weight="650">DRAW</text>
        <text x="205" y="82" text-anchor="end" fill="#a8c0b0" font-size="20" font-weight="800">26%</text>
        <rect y="95" width="205" height="13" rx="6.5" fill="#0c1912"/>
        <rect y="95" width="53" height="13" rx="6.5" fill="#7c9786"/>

        <text x="0" y="152" fill="#e9eee8" font-size="13" font-weight="650">AWAY</text>
        <text x="205" y="152" text-anchor="end" fill="#a8c0b0" font-size="20" font-weight="800">21%</text>
        <rect y="165" width="205" height="13" rx="6.5" fill="#0c1912"/>
        <rect y="165" width="43" height="13" rx="6.5" fill="#4f7160"/>
      </g>
      <rect x="20" y="337" width="205" height="1" fill="#355344"/>
      <text x="20" y="362" fill="#9eb3a5" font-family="Inter,system-ui,sans-serif" font-size="12">Prediction, not certainty</text>
    </g>

    <g transform="translate(895 165)">
      <rect width="235" height="380" rx="22" fill="url(#card)" stroke="#d4ff3f" stroke-opacity=".45"/>
      <rect x="20" y="20" width="42" height="28" rx="8" fill="#d4ff3f" opacity=".14"/>
      <text x="41" y="40" text-anchor="middle" fill="#d4ff3f" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800">04</text>
      <text x="20" y="84" fill="#f3f5ed" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="700">Inspect it</text>
      <text x="20" y="112" fill="#9eb3a5" font-family="Inter,system-ui,sans-serif" font-size="14">Pitch lab + ShapIQ</text>

      <g transform="translate(20 142)">
        <rect width="195" height="118" rx="12" fill="#1e613d"/>
        <g fill="none" stroke="#d4ff3f" stroke-opacity=".68">
          <rect x="7" y="7" width="181" height="104" rx="3"/>
          <line x1="97.5" y1="7" x2="97.5" y2="111"/>
          <circle cx="97.5" cy="59" r="17"/>
        </g>
        <g fill="#d4ff3f">
          <circle cx="42" cy="32" r="5"/><circle cx="76" cy="45" r="5"/><circle cx="48" cy="80" r="5"/>
          <circle cx="146" cy="32" r="5"/><circle cx="119" cy="73" r="5"/><circle cx="153" cy="88" r="5"/>
        </g>
        <path d="M76 45Q99 20 119 73" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 4" opacity=".7"/>
      </g>
      <g transform="translate(20 284)" font-family="Inter,system-ui,sans-serif" font-size="13">
        <circle cx="7" cy="7" r="5" fill="#d4ff3f"/>
        <text x="20" y="12" fill="#e9eee8">Swap a starter</text>
        <circle cx="7" cy="37" r="5" fill="#7adaa5"/>
        <text x="20" y="42" fill="#e9eee8">See probability move</text>
        <circle cx="7" cy="67" r="5" fill="#239ba7"/>
        <text x="20" y="72" fill="#e9eee8">Read the drivers</text>
      </g>
    </g>
  </g>

  <g fill="none" stroke="#7adaa5" stroke-width="2.5" marker-end="url(#arrow)" opacity=".8">
    <path d="M316 355h22"/>
    <path d="M591 355h22"/>
    <path d="M866 355h22"/>
  </g>

  <g transform="translate(70 590)">
    <rect width="1060" height="1" fill="#355344"/>
    <circle cx="8" cy="42" r="5" fill="#d4ff3f"/>
    <text x="24" y="47" fill="#b9c8bd" font-family="Inter,system-ui,sans-serif" font-size="15">
      The result is baked as JSON; FastAPI serves the matchday and Vercel refreshes lineups.
    </text>
    <text x="1060" y="47" text-anchor="end" fill="#7adaa5" font-family="ui-monospace,monospace" font-size="13">SPIELFELD</text>
  </g>
</svg>
